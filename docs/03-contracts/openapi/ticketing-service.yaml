openapi: 3.0.3
info:
  title: TicketFlow Ticketing Service API
  version: 1.0.0
  description: |
    Билеты и проход на мероприятие. Выпуск билетов — асинхронной командой
    `IssueTickets` (см. AsyncAPI), здесь только чтение и погашение.
servers:
  - url: https://api.ticketflow.local/ticketing/v1
security:
  - bearerAuth: []
paths:
  /orders/{orderId}/tickets:
    get:
      operationId: getTicketsByOrder
      summary: Билеты по заказу (для покупателя)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список билетов (пустой, если ещё не выпущены)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
  /check-ins:
    post:
      operationId: checkIn
      summary: Погасить билет на входе (для контролёра)
      description: |
        Атомарно: `UPDATE tickets SET status='USED' WHERE id=? AND status='VALID'`.
        Если обновлено 0 строк — билет уже использован, проход запрещён.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrPayload, gateId]
              properties:
                qrPayload:
                  type: string
                  description: Содержимое QR — id билета + HMAC-подпись
                gateId:
                  type: string
      responses:
        '200':
          description: Проход разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: QR повреждён или подпись неверна
        '409':
          description: Билет уже использован
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ALREADY_USED
                  usedAt:
                    type: string
                    format: date-time
                  gateId:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Ticket:
      type: object
      required: [id, orderId, eventId, seatId, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
        status:
          type: string
          enum: [VALID, USED]
        qrPayload:
          type: string
        issuedAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
