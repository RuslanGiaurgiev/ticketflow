openapi: 3.0.3
info:
  title: TicketFlow Order Service API
  version: 1.0.0
  description: |
    Публичный API заказов. Вызывается веб-клиентом через API Gateway.
    Создание заказа запускает сагу покупки (см. docs/04-main-process.md).
servers:
  - url: https://api.ticketflow.local/order/v1
security:
  - bearerAuth: []
tags:
  - name: orders
paths:
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать заказ и захолдить места
      description: |
        Синхронно холдит места в Inventory и создаёт платёж в Payment.
        Возвращает ссылку на оплату. Дальше сага идёт асинхронно.

        Повторный запрос с тем же `Idempotency-Key` и тем же телом
        возвращает тот же заказ (200), а не создаёт новый.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан, места захолжены, ждём оплату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Повтор запроса с тем же Idempotency-Key — возвращён существующий заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Одно или несколько мест уже заняты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatsUnavailableError'
        '422':
          description: Тот же Idempotency-Key использован с другим телом запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получить заказ и его статус
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отменить заказ до оплаты
      description: |
        Разрешено только в статусе `AWAITING_PAYMENT`. Освобождает места.
        После оплаты отмена невозможна (возврат билетов — вне рамок проекта).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '202':
          description: Отмена принята, места будут освобождены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заказ уже оплачен или уже отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID, генерирует клиент на одну попытку покупки
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Зависимый сервис недоступен, можно повторить с тем же Idempotency-Key
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateOrderRequest:
      type: object
      required: [eventId, seatIds]
      properties:
        eventId:
          type: string
          format: uuid
        seatIds:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            example: A-12-07
        returnUrl:
          type: string
          format: uri
          description: Куда провайдер вернёт покупателя после оплаты
    OrderStatus:
      type: string
      description: |
        PENDING — создаётся, AWAITING_PAYMENT — ждём оплату,
        PAID — оплачено, подтверждаем места, CONFIRMED — места проданы, выпускаем билеты,
        COMPLETED — билеты выпущены, CANCELLED — отменён без списания,
        REFUNDING — оплачен, но места потеряны, делаем возврат, REFUNDED — деньги возвращены.
      enum: [PENDING, AWAITING_PAYMENT, PAID, CONFIRMED, COMPLETED, CANCELLED, REFUNDING, REFUNDED]
    Order:
      type: object
      required: [id, status, eventId, seatIds, amount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        eventId:
          type: string
          format: uuid
        seatIds:
          type: array
          items:
            type: string
        amount:
          $ref: '#/components/schemas/Money'
        holdExpiresAt:
          type: string
          format: date-time
        paymentUrl:
          type: string
          format: uri
          description: Ссылка на страницу оплаты провайдера (есть в AWAITING_PAYMENT)
        cancelReason:
          type: string
          enum: [USER_CANCELLED, PAYMENT_FAILED, HOLD_EXPIRED, SEATS_LOST]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: В минимальных единицах (копейках)
          example: 350000
        currency:
          type: string
          example: RUB
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    SeatsUnavailableError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            unavailableSeatIds:
              type: array
              items:
                type: string
